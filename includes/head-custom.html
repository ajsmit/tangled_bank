<!-- Primary-branch type system: native system/Inter body and UI, Roboto Slab
     headings, JetBrains Mono code, and STIX Two Text for editorial accents.
     STIX Two Math is bundled by MathJax (mathjax-stix2).
     Fonts are self-hosted under /fonts and declared in styles/strata-fonts.css. -->
<link rel="preload" href="/fonts/Inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/RobotoSlab-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/JetBrainsMono-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles/strata-fonts.css?v=20260831-2">
<!-- Loaded after every page theme so legacy and specialised pages inherit the
     same type system and rhythm as the primary branch. -->
<link rel="stylesheet" href="/styles/site-typography.css?v=20260831-3">
<!-- Reset the Reader Mode state saved by the previous layout once. Quarto
     otherwise restores that state and rolls both desktop sidebars into menus. -->
<script>
  (() => {
    const migrationKey = "tb-expanded-sidebars-default-v1";
    try {
      if (window.localStorage.getItem(migrationKey) !== "done") {
        window.localStorage.setItem("quarto-reader-mode", "false");
        window.localStorage.setItem(migrationKey, "done");
      }
    } catch (_error) {
      // Storage can be unavailable in privacy-restricted browser contexts.
    }
  })();
</script>
<script defer src="/scripts/reader-experience.js?v=20260831-2"></script>

<script>
  window.MathJax = {
    output: {
      font: "mathjax-stix2"
    },
    chtml: {
      mtextInheritFont: true,
      matchFontHeight: true
    }
  };
</script>

<!-- Match browser chrome and native controls to the reader's chosen scheme. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101719" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
