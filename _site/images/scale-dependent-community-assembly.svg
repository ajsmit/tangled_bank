<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">A scale-dependent system connecting global change with biogeography</title>
  <desc id="desc">Global change and historical legacies alter environmental gradients. A species pool shaped by evolutionary history encounters these gradients. Niche processes and neutral processes jointly determine local communities. Repeated local outcomes across sites and through time produce biogeographic patterns. Temporal extent, spatial extent, and phylogenetic breadth affect every link.</desc>

  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667788"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27796f"/>
    </marker>
    <linearGradient id="extent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbeaf4"/>
      <stop offset="100%" stop-color="#b9d5e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 31px Arial, Helvetica, sans-serif; fill: #17324d; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #496174; }
      .section { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; fill: #496174; }
      .scale-label { font: 700 16px Arial, Helvetica, sans-serif; fill: #17324d; }
      .scale-text { font: 400 15px Arial, Helvetica, sans-serif; fill: #334e63; }
      .box-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .box-copy { font: 400 16px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .dark-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #17324d; }
      .dark-copy { font: 400 16px Arial, Helvetica, sans-serif; fill: #334e63; }
      .mechanism-title { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 1px; fill: #ffffff; }
      .mechanism-copy { font: 400 15.5px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .arrow-label { font: 600 14px Arial, Helvetica, sans-serif; fill: #496174; }
      .evidence-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #17324d; }
      .evidence-copy { font: 400 14.5px Arial, Helvetica, sans-serif; fill: #496174; }
      .thesis { font: 700 17px Arial, Helvetica, sans-serif; fill: #17324d; }
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="928" rx="18" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/>

  <text x="700" y="45" text-anchor="middle" class="title">From environmental change to biogeographic pattern</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">Local assembly links large-scale drivers to distributions, but the inferred mechanism depends on scale</text>

  <rect x="40" y="103" width="1320" height="160" rx="14" fill="url(#extent)" stroke="#9fbfd3" stroke-width="1.5"/>
  <text x="66" y="132" class="section">EXTENT OF OBSERVATION</text>

  <text x="70" y="166" class="scale-label">Time</text>
  <line x1="264" y1="161" x2="1295" y2="161" stroke="#667788" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="285" y="151" class="scale-text">days and seasons</text>
  <text x="760" y="151" text-anchor="middle" class="scale-text">generations</text>
  <text x="1275" y="151" text-anchor="end" class="scale-text">centuries and deep time</text>

  <text x="70" y="207" class="scale-label">Space</text>
  <line x1="264" y1="202" x2="1295" y2="202" stroke="#667788" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="285" y="192" class="scale-text">microhabitat and site</text>
  <text x="760" y="192" text-anchor="middle" class="scale-text">landscape and catchment</text>
  <text x="1275" y="192" text-anchor="end" class="scale-text">region and globe</text>

  <text x="70" y="248" class="scale-label">Phylogenetic breadth</text>
  <line x1="264" y1="243" x2="1295" y2="243" stroke="#667788" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="285" y="233" class="scale-text">populations</text>
  <text x="760" y="233" text-anchor="middle" class="scale-text">closely related species</text>
  <text x="1275" y="233" text-anchor="end" class="scale-text">distant lineages</text>

  <text x="40" y="300" class="section">CAUSAL SYSTEM</text>

  <rect x="40" y="380" width="210" height="176" rx="16" fill="#b64f36" filter="url(#shadow)"/>
  <text x="145" y="420" text-anchor="middle" class="box-title">
    <tspan x="145" dy="0">Global change and</tspan>
    <tspan x="145" dy="25">historical legacies</tspan>
  </text>
  <text x="145" y="486" text-anchor="middle" class="box-copy">
    <tspan x="145" dy="0">climate, land use,</tspan>
    <tspan x="145" dy="23">disturbance and</tspan>
    <tspan x="145" dy="23">past events</tspan>
  </text>

  <line x1="250" y1="468" x2="289" y2="468" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="300" y="380" width="210" height="176" rx="16" fill="#d89923" filter="url(#shadow)"/>
  <text x="405" y="420" text-anchor="middle" class="box-title">
    <tspan x="405" dy="0">Environmental</tspan>
    <tspan x="405" dy="25">gradients</tspan>
  </text>
  <text x="405" y="486" text-anchor="middle" class="box-copy">
    <tspan x="405" dy="0">conditions vary among</tspan>
    <tspan x="405" dy="23">places and change</tspan>
    <tspan x="405" dy="23">through time</tspan>
  </text>

  <rect x="550" y="286" width="310" height="62" rx="14" fill="#eef2f5" stroke="#9eacb7" stroke-width="1.5"/>
  <text x="705" y="312" text-anchor="middle" class="dark-title">Species pool and ancestry</text>
  <text x="705" y="335" text-anchor="middle" class="dark-copy">organisms and inherited traits available</text>

  <path d="M 510 445 C 536 445, 542 413, 570 413" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <path d="M 510 491 C 536 491, 542 543, 570 543" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <line x1="662" y1="348" x2="662" y2="369" stroke="#667788" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <path d="M 748 348 C 748 374, 791 386, 791 492" fill="none" stroke="#667788" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <rect x="570" y="380" width="270" height="110" rx="16" fill="#238276" filter="url(#shadow)"/>
  <text x="705" y="410" text-anchor="middle" class="mechanism-title">NICHE PROCESSES</text>
  <text x="705" y="441" text-anchor="middle" class="mechanism-copy">
    <tspan x="705" dy="0">trait differences and tolerances</tspan>
    <tspan x="705" dy="22">biotic interactions and filtering</tspan>
  </text>

  <rect x="570" y="510" width="270" height="110" rx="16" fill="#72589b" filter="url(#shadow)"/>
  <text x="705" y="540" text-anchor="middle" class="mechanism-title">NEUTRAL PROCESSES</text>
  <text x="705" y="571" text-anchor="middle" class="mechanism-copy">
    <tspan x="705" dy="0">demographic chance and drift</tspan>
    <tspan x="705" dy="22">dispersal and colonisation history</tspan>
  </text>

  <path d="M 840 435 C 867 435, 872 445, 899 445" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <path d="M 840 565 C 872 565, 871 512, 899 512" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="910" y="380" width="210" height="176" rx="16" fill="#286f9e" filter="url(#shadow)"/>
  <text x="1015" y="420" text-anchor="middle" class="box-title">
    <tspan x="1015" dy="0">Local communities</tspan>
  </text>
  <text x="1015" y="471" text-anchor="middle" class="box-copy">
    <tspan x="1015" dy="0">occurrence, abundance,</tspan>
    <tspan x="1015" dy="23">composition and</tspan>
    <tspan x="1015" dy="23">ecosystem function</tspan>
  </text>

  <line x1="1120" y1="468" x2="1159" y2="468" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <text x="1140" y="345" text-anchor="middle" class="arrow-label">repeated across</text>
  <text x="1140" y="363" text-anchor="middle" class="arrow-label">sites and time</text>

  <rect x="1170" y="380" width="190" height="176" rx="16" fill="#174a72" filter="url(#shadow)"/>
  <text x="1265" y="420" text-anchor="middle" class="box-title">Biogeography</text>
  <text x="1265" y="466" text-anchor="middle" class="box-copy">
    <tspan x="1265" dy="0">turnover and ranges</tspan>
    <tspan x="1265" dy="23">range shifts and</tspan>
    <tspan x="1265" dy="23">biogeographic regions</tspan>
  </text>

  <path d="M 1015 556 C 1015 677, 405 677, 405 567" fill="none" stroke="#27796f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-feedback)"/>
  <rect x="563" y="637" width="330" height="31" rx="15" fill="#e2f2ef"/>
  <text x="728" y="658" text-anchor="middle" class="arrow-label" fill="#27796f">ecological and biogeochemical feedbacks</text>

  <rect x="40" y="695" width="1320" height="194" rx="14" fill="#f7f9fb" stroke="#cbd6df" stroke-width="1.5"/>
  <text x="66" y="727" class="section">EVIDENCE NEEDED TO TEST THE LINKS</text>

  <rect x="66" y="749" width="290" height="111" rx="12" fill="#ffffff" stroke="#d0dae2"/>
  <circle cx="91" cy="777" r="8" fill="#d89923"/>
  <text x="110" y="783" class="evidence-title">Environmental change</text>
  <text x="91" y="815" class="evidence-copy">
    <tspan x="91" dy="0">field measurements, experiments,</tspan>
    <tspan x="91" dy="21">long-term records and remote sensing</tspan>
  </text>

  <rect x="392" y="749" width="290" height="111" rx="12" fill="#ffffff" stroke="#d0dae2"/>
  <circle cx="417" cy="777" r="8" fill="#238276"/>
  <text x="436" y="783" class="evidence-title">Niche mechanisms</text>
  <text x="417" y="815" class="evidence-copy">
    <tspan x="417" dy="0">traits, physiology, performance,</tspan>
    <tspan x="417" dy="21">resources and species interactions</tspan>
  </text>

  <rect x="718" y="749" width="290" height="111" rx="12" fill="#ffffff" stroke="#d0dae2"/>
  <circle cx="743" cy="777" r="8" fill="#72589b"/>
  <text x="762" y="783" class="evidence-title">Neutral mechanisms</text>
  <text x="743" y="815" class="evidence-copy">
    <tspan x="743" dy="0">abundance time series, population size,</tspan>
    <tspan x="743" dy="21">connectivity and movement data</tspan>
  </text>

  <rect x="1044" y="749" width="290" height="111" rx="12" fill="#ffffff" stroke="#d0dae2"/>
  <circle cx="1069" cy="777" r="8" fill="#174a72"/>
  <text x="1088" y="783" class="evidence-title">Emergent pattern</text>
  <text x="1069" y="815" class="evidence-copy">
    <tspan x="1069" dy="0">community surveys, distributions,</tspan>
    <tspan x="1069" dy="21">phylogenies and historical records</tspan>
  </text>

  <text x="700" y="913" text-anchor="middle" class="thesis">Similar patterns can arise by different processes, so evidence must test the connecting links.</text>
</svg>
