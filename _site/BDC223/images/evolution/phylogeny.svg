<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1660" viewBox="0 0 1280 1660" role="img" aria-labelledby="title desc">
  <title id="title">Plastid history and organismal ancestry</title>
  <desc id="desc">One primary endosymbiosis between a eukaryotic host and a cyanobacterium gave rise to the plastids of Archaeplastida: Glaucophyta, Rhodophyta and Viridiplantae. Glaucophytes are freshwater unicells whose plastids retain peptidoglycan and phycobilisomes. Secondary endosymbiosis transferred a red-algal plastid to a different host lineage containing brown algae and diatoms. The lower tree follows green plants through chlorophytes and streptophytes to land plants, bryophytes, vascular plants and seed plants. Several branches are collapsed; branch lengths do not represent time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9e6141"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif;fill:#203e35;}
      .heading {font-size:28px;font-weight:700;}
      .taxon {font-size:23px;font-weight:700;}
      .label {font-size:21px;}
      .detail {font-size:19px;}
      .note {font-size:17px;fill:#52675d;}
      .clade {font-size:17px;fill:#52675d;}
      .branch {fill:none;stroke:#357565;stroke-width:3;stroke-linejoin:round;}
      .transfer {fill:none;stroke:#9e6141;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow);}
    </style>
  </defs>
  <rect width="1280" height="1660" fill="#f7f6ef"/>
  <text x="36" y="46" class="heading">Plastid history and organismal ancestry</text>

  <text x="36" y="108" class="taxon">Cyanobacterium + eukaryotic host</text>
  <text x="36" y="135" class="note">Engulfment followed by permanent integration</text>
  <path class="transfer" d="M430 104 H596"/>
  <text x="442" y="82" class="note">One primary</text>
  <text x="442" y="134" class="note">endosymbiosis</text>
  <text x="620" y="108" class="taxon">Archaeplastida</text>
  <text x="620" y="135" class="detail">Shared ancestor of three plastid-bearing lineages</text>
  <path class="branch" d="M635 151 V166 H158 V418 M158 222 H214 M158 320 H214 M158 418 H214"/>
  <text x="232" y="229" class="taxon">Glaucophyta</text>
  <text x="232" y="256" class="label">Glaucophytes / glaucocystophytes</text>
  <text x="232" y="327" class="taxon">Rhodophyta</text>
  <text x="232" y="354" class="label">Red algae</text>
  <text x="232" y="425" class="taxon">Viridiplantae</text>
  <text x="232" y="452" class="label">Green algae + land plants</text>

  <rect x="692" y="182" width="552" height="280" rx="12" fill="#e6efe8" stroke="#b5c9bb"/>
  <text x="714" y="214" class="label" font-weight="700">Glaucophytes: why they matter</text>
  <text x="714" y="246" class="detail">Freshwater unicells, sometimes in colonies.</text>
  <text x="714" y="273" class="detail">Few described species; rarely found in the field.</text>
  <text x="714" y="312" class="detail">Plastids (cyanelles) retain:</text>
  <text x="714" y="341" class="detail">• peptidoglycan between envelope membranes</text>
  <text x="714" y="368" class="detail">• phycobilisomes, light-harvesting complexes</text>
  <text x="714" y="410" class="note">These features inform early plastid evolution.</text>
  <text x="714" y="436" class="note">Retention and loss vary among other lineages.</text>

  <path class="transfer" d="M410 320 H650 V511 H710"/>
  <text x="232" y="510" class="label" font-weight="700">Secondary endosymbiosis</text>
  <text x="232" y="538" class="detail">Red alga + another eukaryotic host</text>
  <rect x="730" y="484" width="514" height="116" rx="10" fill="#f1e9df" stroke="#d4bba7"/>
  <text x="750" y="511" class="detail" font-weight="700">Within Stramenopiles</text>
  <text x="750" y="538" class="label">Phaeophyceae (brown algae)</text>
  <text x="750" y="564" class="label">Bacillariophyta (diatoms)</text>
  <text x="750" y="588" class="note">Different host ancestry from Archaeplastida</text>
  <text x="36" y="630" class="note">Solid lines: ancestry. Dashed arrows: plastid acquisition. Branch lengths do not represent time.</text>
  <path d="M36 649 H1244" stroke="#c8d3c8"/>

  <text x="36" y="694" class="heading">Within Viridiplantae (green plants)</text>
  <g class="branch">
    <path d="M740 1379 V1475 M740 1379 H838 M740 1475 H838"/>
    <path d="M632 1283 V1427 M632 1283 H838 M632 1427 H740"/>
    <path d="M512 1187 V1355 M512 1187 H838 M512 1355 H632"/>
    <path d="M392 1047 V1271 M392 1047 H838 M392 1271 H512"/>
    <path d="M282 935 V1159 M282 935 H838 M282 1159 H392"/>
    <path d="M172 839 V1047 M172 839 H838 M172 1047 H282"/>
    <path d="M52 743 V943 M52 743 H838 M52 943 H172"/>
  </g>
  <text x="60" y="898" class="clade">Viridiplantae</text>
  <text x="60" y="922" class="clade">Green plants</text>
  <text x="180" y="990" class="clade" style="font-size:16px">Streptophyta</text>
  <text x="180" y="1014" class="clade" style="font-size:16px">Streptophytes</text>
  <text x="400" y="1155" class="clade">Embryophyta</text>
  <text x="400" y="1179" class="clade">Land plants</text>
  <text x="520" y="1230" class="clade">Tracheophyta</text>
  <text x="520" y="1254" class="clade">Vascular plants</text>
  <text x="748" y="1424" class="clade" style="font-size:15px">Spermatophyta</text>
  <text x="748" y="1448" class="clade" style="font-size:15px">Seed plants</text>

  <text x="862" y="750" class="taxon">Chlorophyta</text>
  <text x="862" y="777" class="label">Chlorophyte green algae</text>
  <text x="862" y="846" class="taxon">Other streptophyte algae*</text>
  <text x="862" y="873" class="note">Within Streptophyta; branches collapsed</text>
  <text x="862" y="942" class="taxon">Zygnematophyceae</text>
  <text x="862" y="969" class="label">Conjugating green algae</text>
  <text x="862" y="994" class="note">Including <tspan font-style="italic">Spirogyra</tspan> and <tspan font-style="italic">Zygnema</tspan></text>
  <text x="862" y="1054" class="taxon">Bryophytes</text>
  <text x="862" y="1080" class="detail">Liverworts: Marchantiophyta</text>
  <text x="862" y="1105" class="detail">Mosses: Bryophyta</text>
  <text x="862" y="1130" class="detail">Hornworts: Anthocerotophyta</text>
  <text x="862" y="1194" class="taxon">Lycopodiophyta</text>
  <text x="862" y="1221" class="label">Lycophytes</text>
  <text x="862" y="1290" class="taxon">Polypodiopsida</text>
  <text x="862" y="1317" class="label">Ferns, including horsetails</text>
  <text x="862" y="1342" class="label">and whisk ferns</text>
  <text x="862" y="1386" class="taxon">Gymnospermae</text>
  <text x="862" y="1413" class="label">Living gymnosperms</text>
  <text x="862" y="1438" class="note">Conifers, cycads, <tspan font-style="italic">Ginkgo</tspan>, gnetophytes</text>
  <text x="862" y="1482" class="taxon">Angiospermae</text>
  <text x="862" y="1509" class="label">Angiosperms / flowering plants</text>

  <text x="36" y="1570" class="note">* Several successive algal branches are collapsed here; they do not form a single clade.</text>
  <text x="36" y="1597" class="note">Embryo retention: Embryophyta. Lignified tracheary elements: Tracheophyta.</text>
  <text x="36" y="1624" class="note">Pollen and seeds: Spermatophyta. Several branches and internal relationships are omitted.</text>
</svg>
