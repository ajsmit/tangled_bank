<rect x='11.96' y='676.09' width='840.09' height='56.86' style='stroke-width: 1.07; stroke: none; stroke-linecap: butt; stroke-linejoin: miter; fill: #FFFFFF;' />
<text x='23.41' y='139.86' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='46.28px' lengthAdjust='spacingAndGlyphs'>22–19 ka</text>
<text x='23.41' y='203.04' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='54.92px' lengthAdjust='spacingAndGlyphs'>15–11.7 ka</text>
<text x='23.41' y='266.23' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='48.75px' lengthAdjust='spacingAndGlyphs'>11.7–8 ka</text>
<text x='23.41' y='329.41' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='33.94px' lengthAdjust='spacingAndGlyphs'>8–5 ka</text>
<text x='23.41' y='392.59' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='33.94px' lengthAdjust='spacingAndGlyphs'>5–3 ka</text>
<text x='23.41' y='455.77' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='33.94px' lengthAdjust='spacingAndGlyphs'>3–1 ka</text>
<text x='23.41' y='518.95' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='74.05px' lengthAdjust='spacingAndGlyphs'>1000–1500 CE</text>
<text x='23.41' y='582.13' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='74.05px' lengthAdjust='spacingAndGlyphs'>1500–1850 CE</text>
<text x='23.41' y='645.31' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='74.05px' lengthAdjust='spacingAndGlyphs'>1850–1950 CE</text>
<text x='23.41' y='708.49' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='74.05px' lengthAdjust='spacingAndGlyphs'>1950–2025 CE</text>
<text x='172.34' y='125.13' style='font-size: 10.53px; font-family: "Arial";' textLength='212.20px' lengthAdjust='spacingAndGlyphs'>Glacial conditions and lower sea level expose</text>
<text x='172.34' y='139.66' style='font-size: 10.53px; font-family: "Arial";' textLength='170.70px' lengthAdjust='spacingAndGlyphs'>continental shelves. African moisture</text>
<text x='172.34' y='154.19' style='font-size: 10.53px; font-family: "Arial";' textLength='110.86px' lengthAdjust='spacingAndGlyphs'>patterns vary regionally.</text>
<text x='172.34' y='188.31' style='font-size: 10.53px; font-family: "Arial";' textLength='212.77px' lengthAdjust='spacingAndGlyphs'>Deglaciation changes temperature, coastlines</text>
<text x='172.34' y='202.84' style='font-size: 10.53px; font-family: "Arial";' textLength='191.50px' lengthAdjust='spacingAndGlyphs'>and monsoon strength. Wetter conditions</text>
<text x='172.34' y='217.37' style='font-size: 10.53px; font-family: "Arial";' textLength='182.94px' lengthAdjust='spacingAndGlyphs'>develop across parts of northern Africa.</text>
<text x='172.34' y='251.49' style='font-size: 10.53px; font-family: "Arial";' textLength='207.50px' lengthAdjust='spacingAndGlyphs'>The Holocene begins. Lakes and grasslands</text>
<text x='172.34' y='266.02' style='font-size: 10.53px; font-family: "Arial";' textLength='158.38px' lengthAdjust='spacingAndGlyphs'>expand in parts of the Sahara and</text>
<text x='172.34' y='280.55' style='font-size: 10.53px; font-family: "Arial";' textLength='101.11px' lengthAdjust='spacingAndGlyphs'>neighbouring regions.</text>
<text x='172.34' y='314.67' style='font-size: 10.53px; font-family: "Arial";' textLength='196.97px' lengthAdjust='spacingAndGlyphs'>Humid northern landscapes support lakes,</text>
<text x='172.34' y='329.20' style='font-size: 10.53px; font-family: "Arial";' textLength='190.53px' lengthAdjust='spacingAndGlyphs'>wetlands and grazing. Conditions are not</text>
<text x='172.34' y='343.73' style='font-size: 10.53px; font-family: "Arial";' textLength='101.12px' lengthAdjust='spacingAndGlyphs'>uniform across Africa.</text>
<text x='172.34' y='377.85' style='font-size: 10.53px; font-family: "Arial";' textLength='197.94px' lengthAdjust='spacingAndGlyphs'>The African Humid Period ends at different</text>
<text x='172.34' y='392.38' style='font-size: 10.53px; font-family: "Arial";' textLength='185.30px' lengthAdjust='spacingAndGlyphs'>times across regions as monsoonal rain</text>
<text x='172.34' y='406.91' style='font-size: 10.53px; font-family: "Arial";' textLength='38.56px' lengthAdjust='spacingAndGlyphs'>retreats.</text>
<text x='172.34' y='448.30' style='font-size: 10.53px; font-family: "Arial";' textLength='189.97px' lengthAdjust='spacingAndGlyphs'>Regional vegetation and rainfall changes</text>
<text x='172.34' y='462.83' style='font-size: 10.53px; font-family: "Arial";' textLength='202.03px' lengthAdjust='spacingAndGlyphs'>affect routes through forests and savannas.</text>
<text x='172.34' y='504.22' style='font-size: 10.53px; font-family: "Arial";' textLength='198.70px' lengthAdjust='spacingAndGlyphs'>Regional wet and dry phases alter growing</text>
<text x='172.34' y='518.74' style='font-size: 10.53px; font-family: "Arial";' textLength='182.95px' lengthAdjust='spacingAndGlyphs'>conditions; local records need separate</text>
<text x='172.34' y='533.27' style='font-size: 10.53px; font-family: "Arial";' textLength='64.28px' lengthAdjust='spacingAndGlyphs'>interpretation.</text>
<text x='172.34' y='567.40' style='font-size: 10.53px; font-family: "Arial";' textLength='184.14px' lengthAdjust='spacingAndGlyphs'>African expressions of the Little Ice Age</text>
<text x='172.34' y='581.93' style='font-size: 10.53px; font-family: "Arial";' textLength='210.80px' lengthAdjust='spacingAndGlyphs'>differ among regions, including major drought</text>
<text x='172.34' y='596.45' style='font-size: 10.53px; font-family: "Arial";' textLength='45.02px' lengthAdjust='spacingAndGlyphs'>episodes.</text>
<text x='172.34' y='630.58' style='font-size: 10.53px; font-family: "Arial";' textLength='185.91px' lengthAdjust='spacingAndGlyphs'>Industrial carbon emissions rise globally</text>
<text x='172.34' y='645.11' style='font-size: 10.53px; font-family: "Arial";' textLength='195.80px' lengthAdjust='spacingAndGlyphs'>while African environments undergo major</text>
<text x='172.34' y='659.63' style='font-size: 10.53px; font-family: "Arial";' textLength='85.92px' lengthAdjust='spacingAndGlyphs'>land-use changes.</text>
<text x='172.34' y='693.76' style='font-size: 10.53px; font-family: "Arial";' textLength='202.23px' lengthAdjust='spacingAndGlyphs'>Instrumental records show sustained global</text>
<text x='172.34' y='708.29' style='font-size: 10.53px; font-family: "Arial";' textLength='204.55px' lengthAdjust='spacingAndGlyphs'>warming. Heat and water stress vary across</text>
<text x='172.34' y='722.82' style='font-size: 10.53px; font-family: "Arial";' textLength='73.06px' lengthAdjust='spacingAndGlyphs'>African regions.</text>
<text x='523.65' y='125.13' style='font-size: 10.53px; font-family: "Arial";' textLength='160.73px' lengthAdjust='spacingAndGlyphs'>Foragers use changing mosaics of</text>
<text x='523.65' y='139.66' style='font-size: 10.53px; font-family: "Arial";' textLength='152.55px' lengthAdjust='spacingAndGlyphs'>terrestrial and coastal resources,</text>
<text x='523.65' y='154.19' style='font-size: 10.53px; font-family: "Arial";' textLength='165.44px' lengthAdjust='spacingAndGlyphs'>including the Palaeo-Agulhas Plain.</text>
<text x='523.65' y='188.31' style='font-size: 10.53px; font-family: "Arial";' textLength='145.52px' lengthAdjust='spacingAndGlyphs'>Changing water and vegetation</text>
<text x='523.65' y='202.84' style='font-size: 10.53px; font-family: "Arial";' textLength='179.45px' lengthAdjust='spacingAndGlyphs'>distributions alter routes and access to</text>
<text x='523.65' y='217.37' style='font-size: 10.53px; font-family: "Arial";' textLength='129.77px' lengthAdjust='spacingAndGlyphs'>wild plant and animal foods.</text>
<text x='523.65' y='251.49' style='font-size: 10.53px; font-family: "Arial";' textLength='177.09px' lengthAdjust='spacingAndGlyphs'>Gathering, hunting and fishing persist.</text>
<text x='523.65' y='266.02' style='font-size: 10.53px; font-family: "Arial";' textLength='179.81px' lengthAdjust='spacingAndGlyphs'>Food-production histories differ among</text>
<text x='523.65' y='280.55' style='font-size: 10.53px; font-family: "Arial";' textLength='119.83px' lengthAdjust='spacingAndGlyphs'>regions and communities.</text>
<text x='523.65' y='314.67' style='font-size: 10.53px; font-family: "Arial";' textLength='188.81px' lengthAdjust='spacingAndGlyphs'>Pastoralism develops alongside foraging</text>
<text x='523.65' y='329.20' style='font-size: 10.53px; font-family: "Arial";' textLength='207.52px' lengthAdjust='spacingAndGlyphs'>and fishing; communities combine resources</text>
<text x='523.65' y='343.73' style='font-size: 10.53px; font-family: "Arial";' textLength='78.72px' lengthAdjust='spacingAndGlyphs'>in different ways.</text>
<text x='523.65' y='377.85' style='font-size: 10.53px; font-family: "Arial";' textLength='183.36px' lengthAdjust='spacingAndGlyphs'>Mobility, herding and cultivation change</text>
<text x='523.65' y='392.38' style='font-size: 10.53px; font-family: "Arial";' textLength='175.36px' lengthAdjust='spacingAndGlyphs'>as access to water and grazing shifts.</text>
<text x='523.65' y='406.91' style='font-size: 10.53px; font-family: "Arial";' textLength='187.66px' lengthAdjust='spacingAndGlyphs'>Crop domestication is regionally distinct.</text>
<text x='523.65' y='441.04' style='font-size: 10.53px; font-family: "Arial";' textLength='177.70px' lengthAdjust='spacingAndGlyphs'>Bantu-speaking communities continue</text>
<text x='523.65' y='455.56' style='font-size: 10.53px; font-family: "Arial";' textLength='198.12px' lengthAdjust='spacingAndGlyphs'>spreading. Mixed farming, ironworking and</text>
<text x='523.65' y='470.09' style='font-size: 10.53px; font-family: "Arial";' textLength='164.84px' lengthAdjust='spacingAndGlyphs'>local exchanges reshape plant use.</text>
<text x='523.65' y='504.22' style='font-size: 10.53px; font-family: "Arial";' textLength='182.91px' lengthAdjust='spacingAndGlyphs'>Mapungubwe and Great Zimbabwe link</text>
<text x='523.65' y='518.74' style='font-size: 10.53px; font-family: "Arial";' textLength='180.62px' lengthAdjust='spacingAndGlyphs'>farming, livestock and trade. Climate is</text>
<text x='523.65' y='533.27' style='font-size: 10.53px; font-family: "Arial";' textLength='147.31px' lengthAdjust='spacingAndGlyphs'>one influence on social change.</text>
<text x='523.65' y='567.40' style='font-size: 10.53px; font-family: "Arial";' textLength='176.31px' lengthAdjust='spacingAndGlyphs'>Crop diversity, storage, exchange and</text>
<text x='523.65' y='581.93' style='font-size: 10.53px; font-family: "Arial";' textLength='199.31px' lengthAdjust='spacingAndGlyphs'>movement help communities respond, with</text>
<text x='523.65' y='596.45' style='font-size: 10.53px; font-family: "Arial";' textLength='158.39px' lengthAdjust='spacingAndGlyphs'>unequal resources and outcomes.</text>
<text x='523.65' y='630.58' style='font-size: 10.53px; font-family: "Arial";' textLength='175.97px' lengthAdjust='spacingAndGlyphs'>Colonial land policies and commercial</text>
<text x='523.65' y='645.11' style='font-size: 10.53px; font-family: "Arial";' textLength='187.67px' lengthAdjust='spacingAndGlyphs'>crops alter livelihoods alongside existing</text>
<text x='523.65' y='659.63' style='font-size: 10.53px; font-family: "Arial";' textLength='140.28px' lengthAdjust='spacingAndGlyphs'>farming and pastoral systems.</text>
<text x='523.65' y='686.50' style='font-size: 10.53px; font-family: "Arial";' textLength='177.66px' lengthAdjust='spacingAndGlyphs'>Crop choices, water management and</text>
<text x='523.65' y='701.02' style='font-size: 10.53px; font-family: "Arial";' textLength='157.84px' lengthAdjust='spacingAndGlyphs'>livelihood diversity remain central.</text>
<text x='523.65' y='715.55' style='font-size: 10.53px; font-family: "Arial";' textLength='205.12px' lengthAdjust='spacingAndGlyphs'>Current global measurements are examined</text>
<text x='523.65' y='730.08' style='font-size: 10.53px; font-family: "Arial";' textLength='57.86px' lengthAdjust='spacingAndGlyphs'>in Lecture 5.</text>
<text x='23.41' y='86.16' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='104.80px' lengthAdjust='spacingAndGlyphs'>Approximate period</text>
<text x='172.34' y='86.16' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='138.70px' lengthAdjust='spacingAndGlyphs'>Climate and environments</text>
<text x='523.65' y='86.16' style='font-size: 11.10px; font-weight: bold; font-family: "Arial";' textLength='159.06px' lengthAdjust='spacingAndGlyphs'>People, plants and livelihoods</text>
</g>
<g clip-path='url(#cpMC4wMHw4NjQuMDB8MC4wMHw3NzcuNjA=)'>
<text x='11.96' y='45.77' style='font-size: 12.00px; font-family: "Arial";' textLength='465.05px' lengthAdjust='spacingAndGlyphs'>Selected regional examples | Rows are not spaced to scale; African hydroclimates differ</text>
<text x='11.96' y='33.59' style='font-size: 17.00px; font-weight: bold; font-family: "Arial";' textLength='404.55px' lengthAdjust='spacingAndGlyphs'>An African companion to the long climate timeline</text>
<text x='11.96' y='761.55' style='font-size: 10.00px; font-family: "Arial";' textLength='429.73px' lengthAdjust='spacingAndGlyphs'>Schematic summary of Lecture 4; periods overlap and do not imply one continent-wide response.</text>
</g>
</g>
</svg>
