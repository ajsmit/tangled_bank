<style>
.mcq { border: 1px solid var(--bs-border-color, #d0d7de); border-radius: 6px; padding: 0.9rem 1.1rem 0.6rem; margin: 1.2rem 0; }
.mcq > p:first-child { margin-bottom: 0.6rem; }
.mcq ul.mcq-options { list-style: none; padding-left: 0; margin: 0 0 0.4rem; counter-reset: mcq; }
.mcq ul.mcq-options > li { counter-increment: mcq; position: relative; padding: 0.45rem 2.2rem 0.45rem 2.4rem; margin: 0.3rem 0; border: 1px solid var(--bs-border-color, #d0d7de); border-radius: 5px; cursor: pointer; transition: background-color 0.15s; }
.mcq ul.mcq-options > li::before { content: counter(mcq, upper-alpha) "."; position: absolute; left: 0.8rem; font-weight: 600; }
.mcq ul.mcq-options > li:hover { background-color: rgba(127, 127, 127, 0.08); }
.mcq ul.mcq-options > li.mcq-right { background-color: rgba(46, 160, 67, 0.15); border-color: #2ea043; }
.mcq ul.mcq-options > li.mcq-wrong { background-color: rgba(218, 54, 51, 0.12); border-color: #da3633; }
.mcq ul.mcq-options > li.mcq-right::after { content: "\2713"; position: absolute; right: 0.8rem; color: #2ea043; font-weight: 700; }
.mcq ul.mcq-options > li.mcq-wrong::after { content: "\2717"; position: absolute; right: 0.8rem; color: #da3633; font-weight: 700; }
.mcq .mcq-feedback { font-size: 0.9em; margin: 0.2rem 0 0.4rem; min-height: 1.2em; }
.mcq .mcq-explain { display: none; font-size: 0.92em; border-top: 1px dashed var(--bs-border-color, #d0d7de); padding-top: 0.5rem; margin-top: 0.3rem; }
.mcq.mcq-solved .mcq-explain { display: block; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("div.mcq").forEach(function (box) {
    var list = box.querySelector("ul");
    if (!list) return;
    list.classList.add("mcq-options");
    var feedback = document.createElement("p");
    feedback.className = "mcq-feedback";
    list.after(feedback);
    list.querySelectorAll(":scope > li").forEach(function (li) {
      var mark = li.querySelector("span.correct");
      if (mark) {
        li.dataset.correct = "1";
        mark.replaceWith.apply(mark, Array.from(mark.childNodes));
      }
      li.setAttribute("role", "button");
      li.tabIndex = 0;
      var choose = function () {
        if (li.dataset.correct === "1") {
          li.classList.add("mcq-right");
          box.classList.add("mcq-solved");
          feedback.textContent = "Correct.";
        } else {
          li.classList.add("mcq-wrong");
          if (!box.classList.contains("mcq-solved")) feedback.textContent = "Not this one. Try again.";
        }
      };
      li.addEventListener("click", choose);
      li.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); } });
    });
  });
});
</script>
