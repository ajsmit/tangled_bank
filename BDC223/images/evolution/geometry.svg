<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">Growing larger while retaining exchange area</title><desc id="desc">Comparison of a sphere, a narrow filament and a thin sheet, with surface-area-to-volume formulae and relevant plant examples.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#9e6141"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f7f6ef"/><style>text{font-family:Arial,sans-serif;fill:#203e35}.small{font-size:16px}.label{font-size:19px}.heading{font-size:24px;font-weight:bold}.note{fill:#57685e;font-size:15px}.branch{stroke:#357565;stroke-width:3;fill:none}.transfer{stroke:#9e6141;stroke-width:2;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}</style>
<text x="30" y="42" class="heading">Size and shape both matter</text>
<path d="M360 72 V425" stroke="#cad4c8"/>
<path d="M720 72 V425" stroke="#cad4c8"/>
<circle cx="115" cy="159" r="31" fill="#76a992" stroke="#357565" stroke-width="2"/><circle cx="253" cy="159" r="62" fill="#76a992" stroke="#357565" stroke-width="2"/>
<text x="36" y="88" class="label">Increase radius</text>
<text x="65" y="252" class="label">Sphere: A/V = 3/r</text>
<text x="38" y="302" class="small">Double r: area ×4, volume ×8.</text>
<text x="38" y="330" class="small">SA:V falls by half.</text>
<text x="38" y="390" class="note">Thicker bodies lengthen diffusion paths.</text>
<rect x="399" y="137" width="276" height="44" rx="22" fill="#76a992" stroke="#357565" stroke-width="2"/>
<path d="M443 138 V180" stroke="#357565"/>
<path d="M485 138 V180" stroke="#357565"/>
<path d="M527 138 V180" stroke="#357565"/>
<path d="M569 138 V180" stroke="#357565"/>
<path d="M611 138 V180" stroke="#357565"/>
<text x="390" y="88" class="label">Extend a narrow filament</text>
<text x="420" y="252" class="label">Long cylinder: A/V ≈ 2/r</text>
<text x="390" y="302" class="small">Length can increase at fixed radius.</text>
<text x="390" y="330" class="small">Most cells remain close to the water.</text>
<text x="390" y="390" class="note">Examples: Spirogyra, fine root axes.</text>
<path d="M769 129 L979 105 L1030 186 L821 210 Z" fill="#76a992" stroke="#357565" stroke-width="2"/><path d="M821 210 V219 L1030 195 V186" fill="#547f69" stroke="#357565"/>
<text x="750" y="88" class="label">Expand a thin sheet</text>
<text x="775" y="252" class="label">Broad sheet: A/V ≈ 2/t</text>
<text x="750" y="302" class="small">Area can increase at fixed thickness t.</text>
<text x="750" y="330" class="small">Short paths remain across the blade.</text>
<text x="750" y="390" class="note">Examples: Ulva blades, thin leaves.</text>
<text x="30" y="450" class="note">Cylinder ends and sheet edges are omitted. These geometric models do not predict uptake rates on their own.</text>
</svg>