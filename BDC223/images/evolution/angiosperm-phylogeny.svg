<text x="72" y="239" class="note">Angiosperms</text>
<text x="320" y="448" class="note">Mesangiosperms</text>
<text x="30" y="575" class="note">Relationships among the five mesangiosperm branches are omitted here, rather than asserted to be simultaneous.</text>
<text x="30" y="600" class="note">All named branches have living representatives. An early-diverging branch is not the ancestor of the others.</text>
