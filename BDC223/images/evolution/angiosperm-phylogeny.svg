<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">Major living angiosperm branches</title><desc id="desc">Amborella, Nymphaeales and Austrobaileyales are successive early branches. Mesangiosperms include magnoliids, monocots, eudicots, Chloranthales and Ceratophyllales. Relationships within mesangiosperms are deliberately left unresolved in this teaching diagram.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#9e6141"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f7f6ef"/><style>text{font-family:Arial,sans-serif;fill:#203e35}.small{font-size:16px}.label{font-size:19px}.heading{font-size:24px;font-weight:bold}.note{fill:#57685e;font-size:15px}.branch{stroke:#357565;stroke-width:3;fill:none}.transfer{stroke:#9e6141;stroke-width:2;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}</style>
<text x="30" y="43" class="heading">A closer look at flowering plants</text>
<text x="570" y="116" class="label">Amborella</text>
<text x="570" y="171" class="label">Nymphaeales · water lilies</text>
<text x="570" y="226" class="label">Austrobaileyales</text>
<text x="570" y="311" class="label">Magnoliids · Magnolia, Persea, Piper</text>
<text x="570" y="366" class="label">Monocots · grasses, palms, orchids, aloes</text>
<text x="570" y="421" class="label">Eudicots · Protea, legumes, daisies, oaks</text>
<text x="570" y="476" class="label">Chloranthales</text>
<text x="570" y="531" class="label">Ceratophyllales</text>
